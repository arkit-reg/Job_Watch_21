# Job watch settings. Matching ignores case and works on whole words, so "QA" won't match
# "Qatar" and "intern" won't match "internal". A space also matches "-" or "/".

# A job title must contain at least one of these...
# Your target role titles. Matched flexibly: any word order, QA = Quality Assurance, RA = Regulatory
# Affairs, CSV = Computer System Validation, QMS = Quality Management System, levels I and II both count,
# plurals count. (Senior, III, IV, Manager and other exclusions below still apply.)
title_match = "words"
include = [
  "Manufacturing QA Associate",
  "QA Associate",
  "Quality Assurance Associate",
  "QA Operations Associate",
  "Quality Operations Associate",
  "Quality Assurance Specialist I",
  "Manufacturing Quality Specialist",
  "Batch Record Reviewer",
  "Batch Record Review Associate",
  "QA On-the-Floor Associate",
  "IPQA Associate",
  "QA Disposition Associate",
  "Quality Systems Associate",
  "Quality Systems Specialist",
  "Quality Compliance Associate",
  "Quality Compliance Specialist",
  "Quality Assurance Compliance Specialist",
  "QMS Specialist",
  "Deviation Specialist",
  "CAPA Specialist",
  "Change Control Specialist",
  "Quality Event Specialist",
  "GMP Compliance Specialist",
  "Quality Documentation Specialist",
  "Document Control Specialist",
  "QA Document Control Specialist",
  "GMP Document Control Associate",
  "Quality Documentation Associate",
  "Document Control Coordinator",
  "Quality Systems Coordinator",
  "GMP Documentation Specialist",
  "Document Management Specialist",
  "Training Compliance Coordinator",
  "Regulatory Affairs Associate",
  "Regulatory Affairs Specialist I",
  "Regulatory Affairs Assistant",
  "Regulatory Affairs Coordinator",
  "Regulatory Operations Associate",
  "Regulatory Operations Specialist",
  "Regulatory Submission Associate",
  "Regulatory Documentation Specialist",
  "Regulatory Compliance Associate",
  "Regulatory Intelligence Associate",
  "Regulatory CMC Associate",
  "CMC Regulatory Affairs Associate",
  "Regulatory Affairs CMC Specialist",
  "Regulatory Submission Specialist",
  "CMC Documentation Specialist",
  "CMC Associate",
  "Regulatory Dossier Associate",
  "Regulatory Lifecycle Management Associate",
  "Post-Approval Regulatory Associate",
  "Regulatory Submission Coordinator",
  "Validation Associate",
  "Validation Specialist I",
  "QA Validation Associate",
  "Quality Validation Specialist",
  "CSV Associate",
  "Computer System Validation Associate",
  "Validation Documentation Specialist",
  "GMP Systems Specialist",
  "Quality Systems Analyst",
  "eQMS Specialist"
]

# ...and none of these. Tuned for entry level; delete any you'd still want to hear about.
exclude = [
  # seniority
  "senior", "sr", "principal", "staff", "lead", "supervisor", "manager", "director", "dir",
  "head of", "vice president", "VP", "chief", "III", "IV",
  "intern", "internship", "co-op",
  # research and lab roles (also catches "Assay Validation Scientist")
  "research", "scientist", "postdoc", "assay", "bioassay", "laboratory technician", "lab technician",
  # software testing
  "software", "SDET", "test engineer", "test analyst", "tester", "QA automation", "test automation",
  "automation engineer", "data validation",
  # other fields that share words with yours
  "counsel", "attorney", "paralegal", "regulatory reporting", "commercial compliance", "healthcare compliance",
  "trade compliance", "export compliance", "privacy", "SOX", "tax", "financial", "finance", "ethics",
  "environmental", "EHS", "HSE",
  # roles that share words with the newer role groups
  "sales", "marketing", "forklift", "warehouse", "driver", "physician", "nurse",
]

# After reading each new job's full description:
# skip jobs outside the US (uses the job system's country, the location, then the description)
us_only = true
# skip jobs whose lowest experience requirement is above this ("Bachelor's + 5 or Master's + 3" counts as 3)
max_years_experience = 3
# Experience limit for companies marked important in companies.csv (raise to 3 or 4 if a referral
# could get you considered for slightly more senior roles there)
important_max_years_experience = 4

# Typed into the search box on Workday sites (most big pharma), one search per term.
# Workday search is fuzzy, so keep these broad; the include/exclude lists above do the real filtering.
search_terms = ["regulatory", "quality", "QA", "validation", "compliance", "document control",
                "CAPA", "qualification", "batch record", "labeling"]

# Optional location filters. Jobs with no location listed are always kept.
# Empty location_include means anywhere.
location_include = []
# US-only: some companies list a site name (Regeneron shows "Limerick") instead of the country, so both are here.
location_exclude = [
  # countries
  "Ireland", "United Kingdom", "England", "Scotland", "Wales", "Switzerland", "Germany", "France", "Belgium",
  "Netherlands", "Spain", "Italy", "Denmark", "Sweden", "Norway", "Finland", "Austria", "Poland", "Czech",
  "Hungary", "Portugal", "Greece", "Turkey", "Israel", "Egypt", "Saudi Arabia", "UAE", "Canada", "Mexico",
  "Brazil", "Argentina", "Colombia", "Chile", "Costa Rica", "Japan", "China", "Hong Kong", "Taiwan", "India",
  "Singapore", "Korea", "Australia", "New Zealand", "Philippines", "Vietnam", "Thailand", "Malaysia", "Indonesia",
  "South Africa",
  # cities that job sites often list without the country
  "Limerick", "Dublin", "Cork", "Galway", "Carlow", "Sligo", "London", "Zug", "Basel", "Geneva", "Paris", "Lyon",
  "Munich", "Frankfurt", "Berlin", "Ludwigshafen", "Penzberg", "Mannheim", "Leiden", "Amsterdam", "Brussels",
  "Antwerp", "Beerse", "Geel", "Copenhagen", "Stockholm", "Madrid", "Barcelona", "Milan", "Rome", "Vienna",
  "Warsaw", "Krakow", "Prague", "Budapest", "Lisbon", "Toronto", "Montreal", "Mississauga", "Mexico City",
  "Sao Paulo", "São Paulo", "Buenos Aires", "Bogota", "Bogotá", "Heredia", "Tokyo", "Osaka", "Seoul", "Shanghai",
  "Beijing", "Suzhou", "Hangzhou", "Guangzhou", "Shenzhen", "Taipei", "Hyderabad", "Bengaluru", "Bangalore",
  "Mumbai", "Ahmedabad", "Pune", "Goa", "Chennai", "Gurgaon", "Gurugram", "Noida", "Vadodara", "Sydney",
  "Melbourne", "Manila", "Bangkok", "Kuala Lumpur", "Jakarta",
]

# Only send jobs posted within this many hours (0 = no limit).
# Workday sites only show whole days, so 72 keeps "Today", "Yesterday" and "2 Days Ago".
# Sites that show no posting date: a job counts as new when it first appears (checked every 3 hours).
max_age_hours = 336   # 14 days: also catches roles at sites read for the first time

# Third source: JSearch = Google Jobs data (LinkedIn, Indeed, Glassdoor, ZipRecruiter, company sites).
# Free plan: 200 searches a month. 3 searches x 2 time slots a day x 30 days = 180.
# Needs the RAPIDAPI_KEY secret. jsearch_any_company = true keeps pharma/biotech postings from ANY employer.
jsearch_queries = ["QA specialist pharmaceutical", "regulatory affairs associate", "validation specialist GMP"]
jsearch_calls_per_slot = 3
jsearch_hours = [8, 15]          # Eastern time: the first run at or after each hour does the searches
jsearch_date_posted = "today"
jsearch_any_company = true

# Second source: Adzuna job search (free API key; add ADZUNA_APP_ID and ADZUNA_APP_KEY secrets).
# Each run searches these titles across the US for postings from the last day. The free plan allows
# 2,500 searches a month, so keep (number of searches per run) x 8 runs x 30 days under that.
adzuna_queries = ["quality assurance", "regulatory affairs", "validation specialist", "document control",
                  "QA specialist", "computer system validation", "regulatory associate", "quality specialist"]
adzuna_max_calls_per_run = 8
adzuna_days = 1
# false = only postings from companies in companies.csv; true = any US employer (more jobs, more noise)
adzuna_any_company = false

# Public repository: keep run logs to counts only (anyone can read them), and leave the
# sponsorship columns out of jobs_log.csv. Your emails still show the sponsorship notes.
quiet_logs = true
log_sponsorship = false

# List every check-by-hand company (with links) in every email; false = only when the list changes
# and in the first email after 8 AM.
manual_list_in_every_email = true

# Sites on the check-by-hand list are retried only this often (hours), last in line, so they
# don't use up the time readable sites need. A site that starts working again is checked normally.
check_by_hand_retry_hours = 24

# Never repeat: a job counts as already sent if its link was sent before (under any company name),
# or this company already sent the same job title at any location.
never_repeat_title = true

# Re-check every open job once against the current filters (jobs already emailed are never resent).
# Change the date to run it again after changing filters.
recheck_open_jobs_once = "2026-11-12"

# ---- Top picks: the jobs to apply to first, at the top of every email ----
# Each job is scored on: your strongest experience found in the description (below), experience asked,
# your company tags (important / H1B-friendly / immigrant-friendly), sponsorship wording, how recent, and location.
top_picks = 5                      # how many to show (0 turns the section off)
top_picks_min_jobs = 3             # only show the section when an email has at least this many jobs
# 3 points each: your strongest, most specific experience (from your master resume)
fit_strong = ["document control", "controlled document", "batch record", "good documentation practice", "GDP",
              "deviation", "CAPA", "change control", "SOP", "standard operating procedure", "document management",
              "EDMS", "line clearance", "annual product review", "APQR", "gap assessment", "data integrity", "ALCOA",
              "CTD", "eCTD", "CMC", "regulatory submission", "dossier"]
# 1 point each: relevant background that most postings in your field mention
fit_good = ["GMP", "cGMP", "quality systems", "quality assurance", "audit", "inspection readiness", "self-inspection",
            "training records", "regulatory affairs", "ICH", "FDA", "validation", "labeling", "biologics", "release",
            "product complaints", "investigation", "pharmaceutical"]
home_state = "MA"                  # a small bonus for jobs here, and a smaller one for nearby states
nearby_states = ["NH", "RI", "CT", "ME", "VT", "NY", "NJ"]

# Recruiters and consulting firms (the groups in companies.csv with "recruit" or "consult" in the name)
# come last in each email, with at most this many jobs per firm. Set include_recruiters = false to drop them.
include_recruiters = true
max_jobs_per_recruiter = 3

# Full checks run once per time slot on the clock (Eastern): with 3 that's 12 AM, 3, 6, 9 AM,
# 12 PM, 3, 6 and 9 PM. GitHub wakes the workflow every 15 minutes; the first wake-up in each
# slot runs the check and the rest stop in a few seconds.
run_every_hours = 3

# Email (if set up) only arrives when there are new jobs. Set to true to also get "no new jobs" emails.
email_every_run = true

# When a careers page shows no job list, open it in a real (headless) browser, the way a person would.
# Needs the browser installed (the GitHub workflow does this). Found job boards are saved, so this is
# mostly a one-time cost per company.
browser_fallback = true

# How often each batch in companies.csv (the priority column) is checked. Runs happen every 3 hours,
# so use multiples of 3: high = every run (3 hours), medium and normal as set here.
medium_interval_hours = 3
normal_interval_hours = 3

# Stop starting new companies after this many minutes and finish them next run.
# Public repository: GitHub minutes are unlimited, so runs can take longer (the workflow stops a run at 40).
# For a private repository use 5 (2,000 free minutes a month).
max_run_minutes = 40

# How many sites to check at the same time
workers = 32
